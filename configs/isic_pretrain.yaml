# Предобучение энкодера на ISIC 2024 (SLICE-3D): 400k снимков смартфонного качества.
seed: 0
device: auto
deterministic: false

data:
  isic_root: data/isic2024
  img_size: 224
  augment: phone
  num_workers: 6
  neg_per_pos: 20        # в каждой эпохе: все злокачественные + в 20 раз больше случайных доброкачественных
  val_neg_max: 20000     # ограничение доброкачественных на валидации и тесте ради скорости

model: {kind: image, backbone: efficientnet_b0, init: imagenet, dropout: 0.3}

train:
  epochs: 30
  batch_size: 64
  lr_encoder: 2.0e-4
  lr_head: 1.0e-3
  weight_decay: 1.0e-4
  warmup_epochs: 1
  loss: bce
  pos_weight: 4.0
  monitor: pauc80        # официальная метрика ISIC 2024
  patience: 8
  grad_clip: 1.0
  amp: true

eval: {n_boot: 500}

output:
  runs_dir: runs
  name: isic_pretrain_efficientnet_b0
